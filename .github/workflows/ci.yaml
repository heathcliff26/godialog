---
name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Is a release"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "*.go"
      - "**/*.go"
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  lint:
    uses: heathcliff26/ci/.github/workflows/golang-fyne-lint.yaml@482d6b77bbafaa616f7b29ee8086e998ceb2ab7c # main
    permissions:
      contents: read

  gosec:
    uses: heathcliff26/ci/.github/workflows/golang-gosec.yaml@482d6b77bbafaa616f7b29ee8086e998ceb2ab7c # main
    permissions:
      contents: read
      security-events: write

  unit-tests-linux:
    uses: heathcliff26/ci/.github/workflows/golang-unit-tests.yaml@482d6b77bbafaa616f7b29ee8086e998ceb2ab7c # main
    permissions:
      contents: read
    with:
      cmd: hack/unit-tests.sh
      os: ubuntu-latest
      coveralls: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

  unit-tests-windows:
    uses: heathcliff26/ci/.github/workflows/golang-unit-tests.yaml@482d6b77bbafaa616f7b29ee8086e998ceb2ab7c # main
    permissions:
      contents: read
    with:
      cmd: go test -v -timeout 300s ./...
      os: windows-latest

  validate:
    uses: heathcliff26/ci/.github/workflows/golang-build.yaml@482d6b77bbafaa616f7b29ee8086e998ceb2ab7c # main
    permissions:
      contents: read
    with:
      cache: false
      cmd: "make validate"
